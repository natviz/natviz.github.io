<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitten sprite extraction - review</title>
<style>
  body { background:#f5f0ea; font-family:system-ui,sans-serif; padding:20px; }
  h1 { font-size:18px; }
  .grid { display:flex; flex-wrap:wrap; gap:14px; }
  .cell { width:150px; border:1px solid #ccc; border-radius:8px; overflow:hidden; background: repeating-conic-gradient(#e8e2d8 0% 25%, #f2ede4 0% 50%) 0 0/20px 20px; text-align:center; }
  .cell img { width:140px; height:130px; object-fit:contain; display:block; margin:0 auto; }
  .cell .cap { padding:4px 2px; font-size:11px; background:#fff; }
  .row-sep { flex-basis:100%; height:2px; background:#999; margin:8px 0; }
</style>
</head>
<body>
<h1>Проверка вырезки кадров из спрайт-листа (25 поз, прозрачный фон)</h1>
<div class="grid">
  <div class="cell"><img src="assets/cat/idle.png"><div class="cap">idle</div></div>
  <div class="cell"><img src="assets/cat/walk-01.png"><div class="cap">walk-01</div></div>
  <div class="cell"><img src="assets/cat/walk-02.png"><div class="cap">walk-02</div></div>
  <div class="cell"><img src="assets/cat/walk-03.png"><div class="cap">walk-03</div></div>
  <div class="cell"><img src="assets/cat/walk-04.png"><div class="cap">walk-04</div></div>
  <div class="cell"><img src="assets/cat/run-01.png"><div class="cap">run-01</div></div>
  <div class="cell"><img src="assets/cat/run-02.png"><div class="cap">run-02</div></div>
  <div class="cell"><img src="assets/cat/run-03.png"><div class="cap">run-03</div></div>
  <div class="cell"><img src="assets/cat/run-04.png"><div class="cap">run-04</div></div>
  <div class="row-sep"></div>
  <div class="cell"><img src="assets/cat/sit.png"><div class="cap">sit</div></div>
  <div class="cell"><img src="assets/cat/look-left.png"><div class="cap">look-left</div></div>
  <div class="cell"><img src="assets/cat/look-right.png"><div class="cap">look-right</div></div>
  <div class="cell"><img src="assets/cat/look-up.png"><div class="cap">look-up</div></div>
  <div class="cell"><img src="assets/cat/sniff.png"><div class="cap">sniff</div></div>
  <div class="cell"><img src="assets/cat/bite.png"><div class="cap">bite</div></div>
  <div class="cell"><img src="assets/cat/play-01.png"><div class="cap">play-01</div></div>
  <div class="cell"><img src="assets/cat/play-02.png"><div class="cap">play-02</div></div>
  <div class="cell"><img src="assets/cat/play-03.png"><div class="cap">play-03</div></div>
  <div class="row-sep"></div>
  <div class="cell"><img src="assets/cat/happy.png"><div class="cap">happy</div></div>
  <div class="cell"><img src="assets/cat/surprised.png"><div class="cap">surprised</div></div>
  <div class="cell"><img src="assets/cat/curious.png"><div class="cap">curious</div></div>
  <div class="cell"><img src="assets/cat/purr.png"><div class="cap">purr</div></div>
  <div class="cell"><img src="assets/cat/sleep.png"><div class="cap">sleep</div></div>
  <div class="cell"><img src="assets/cat/with-toy.png"><div class="cap">with-toy</div></div>
  <div class="cell"><img src="assets/cat/tail-up.png"><div class="cap">tail-up</div></div>
</div>
</body>
</html>
